[[invariant]]
id = "INV-METRIC-007"
family = "source-evidence-identity"
severity = "P1"
invariant = "Metric identity, evidence binding, and boundary spans are derived from corpus-resolved source text rather than model-supplied casing or case-folded coordinates."
finding = "A draft could capitalize the source pronoun It as IT and manufacture an initialism binding; Unicode case-fold expansion could also shift later boundary offsets."
disposition = "fixed"
owner = "verification"
source = "PR4:review-thread:PRRT_kwDOTnrM486Wgox7"
tests = [
  "test_model_casing_cannot_turn_source_pronoun_into_metric_initialism",
  "test_source_casing_controls_metric_identity_when_draft_changes_case",
  "test_unicode_casefold_length_change_cannot_shift_evidence_boundaries",
]

[[invariant]]
id = "INV-ABSENCE-010"
family = "scan-completeness"
severity = "P1"
invariant = "Authoritative absence independently reruns the exhaustive exact-metric scan against the bound corpus snapshot and requires the complete match set to equal the sealed probe."
finding = "A probe whose reported complete scan omitted a value-bearing metric chunk could authorize a false not-found conclusion."
disposition = "fixed"
owner = "absence"
source = "PR4:review-memo:greptile-exact-scan-omission"
tests = ["test_authorization_revalidates_omitted_exact_scan_matches"]

[[invariant]]
id = "INV-METRIC-008"
family = "source-evidence-identity"
severity = "P1"
invariant = "Only punctuation present in the corpus-resolved metric span may disambiguate a bare compact initialism in an all-caps assertion."

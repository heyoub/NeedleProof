# Machine-readable adjudication registry for review-derived authority invariants.
# P0/P1 findings must not remain open when a pull request is marked ready.

[[invariant]]
id = "INV-METRIC-004"
family = "metric-identity"
severity = "P1"
invariant = "Compact initialisms never equal ordinary words; compact and dotted initialisms remain equivalent."
finding = "The metric IT matched the pronoun It after case folding."
disposition = "fixed"
owner = "binding"
tests = [
  "test_compact_initialism_never_binds_to_ordinary_word",
  "test_compact_and_dotted_initialism_authorize_the_same_exact_metric",
  "test_conflict_ownership_cannot_borrow_pronoun_value_for_initialism",
  "test_exact_scan_post_filter_does_not_confuse_initialism_with_ordinary_word",
]

[[invariant]]
id = "INV-METRIC-005"
family = "metric-identity"
severity = "P1"
invariant = "Longer all-caps ordinary-word typography remains case-insensitive; ambiguous short forms cannot authorize not-found."
finding = "REVENUE typography could be post-filtered from a Revenue absence scan while short initialisms still required kind preservation."
disposition = "fixed"
owner = "retrieval"
tests = [
  "test_longer_all_caps_word_styling_preserves_ordinary_metric_identity",
  "test_exact_scan_matches_longer_all_caps_word_typography",
  "test_kind_ambiguous_exact_scan_cannot_authorize_absence",
]

[[invariant]]
id = "INV-ABSENCE-007"
family = "proof-completeness"
severity = "P1"
invariant = "Not-found authority requires complete analysis context around every exact metric occurrence."
finding = "A bounded display excerpt could hide a later value in the same source chunk."
disposition = "fixed"
owner = "absence"
tests = [
  "test_complete_same_chunk_context_blocks_absence_beyond_display_window",
  "test_ambiguous_abbreviation_punctuation_cannot_hide_same_chunk_value",
  "test_absence_probe_handles_metric_values_split_across_chunk_edges",
  "test_open_anaphoric_continuation_extends_into_linked_chunk",
  "test_metric_at_chunk_end_follows_linked_anaphoric_value",
  "test_second_same_chunk_anaphor_makes_absence_incomplete",
  "test_terminal_unpunctuated_anaphor_is_analyzed_without_crashing",
]

[[invariant]]
id = "INV-TEMPORAL-010"
family = "temporal-identity"
severity = "P2"
invariant = "Temporal anchors use case-folded word identity without inheriting metric initialism kinds."
finding = "The temporal anchor FY 2025 failed to bind to its all-caps source spelling."
disposition = "fixed"
owner = "binding"
tests = ["test_temporal_anchor_casefolding_does_not_inherit_metric_initialism_identity"]

[[invariant]]
id = "INV-ABSENCE-008"
family = "bounded-work"
severity = "P2"
invariant = "An exhaustive exact scan exceeding its breadth budget fails closed without materializing the corpus."
finding = "A common metric could force an unbounded exact scan."
disposition = "fixed"
owner = "retrieval"
tests = [
  "test_exact_metric_scan_counts_before_materializing_too_broad_result",
  "test_too_broad_exact_scan_is_typed_incomplete_not_absence",
]

[[invariant]]
id = "INV-CONFLICT-009"
family = "supported-syntax"
severity = "P3"
invariant = "Value-first collective conflict syntax remains unverified unless each operand has a local positive metric binding."
finding = "A value-first collective conflict phrase is unsupported."
disposition = "accepted_limitation"
owner = "verification"
tests = ["test_collective_conflict_profile_rejects_competing_subjects_and_tails"]

[[invariant]]
id = "INV-RESOURCE-002"
family = "resource-lifecycle"
severity = "P2"
invariant = "The shared embedding client closes exactly once only after service-owned tasks drain."
finding = "CorpusStore retained its lazy client, and a bounded shutdown could close it while a run task remained alive."
disposition = "fixed"
owner = "retrieval"
tests = [
  "test_corpus_store_closes_shared_embedding_client_exactly_once",
  "test_shutdown_reports_pending_before_shared_dependencies_may_close",
  "test_shutdown_reports_drained_when_no_task_can_retain_shared_dependencies",
  "test_shutdown_may_release_corpus_before_receipt_finalizer_drains",
  "test_lifespan_never_closes_corpus_retained_by_a_run",
  "test_golden_cli_closes_temporary_embedding_store",
]

[[invariant]]
id = "INV-VALUE-001"

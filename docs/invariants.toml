  "test_metric_at_chunk_end_follows_linked_anaphoric_value",
  "test_linked_anaphoric_qualitative_predicate_blocks_absence",
  "test_second_same_chunk_anaphor_value_requires_review",
  "test_terminal_unpunctuated_anaphor_is_analyzed_without_crashing",
  "test_completed_local_anaphor_includes_linked_coreferential_value",

disposition = "fixed"
owner = "binding"
source = "PR4:review-thread:model-supplied-dots"
tests = ["test_model_supplied_dots_cannot_disambiguate_undotted_all_caps_source"]

[[invariant]]
id = "INV-ABSENCE-011"

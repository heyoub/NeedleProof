name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check apps/api/src/needleproof_api tests
      - run: uv run ruff check apps/api/src/needleproof_api tests
      - run: uv run ty check --python-version ${{ matrix.python }} apps/api/src/needleproof_api
      - run: uv run pytest -q
      - run: uv run needleproof rehearsal

  web:
    name: Web and browser contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.3"
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @needleproof/web check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: needleproof:ci
          build-args: |
            NEEDLEPROOF_GIT_SHA=${{ github.sha }}
            NEEDLEPROOF_UV_LOCK_SHA256=${{ hashFiles('uv.lock') }}
            NEEDLEPROOF_PNPM_LOCK_SHA256=${{ hashFiles('pnpm-lock.yaml') }}
            NEEDLEPROOF_IMAGE_REVISION=${{ github.sha }}
      - name: Offline container runtime smoke
        run: |
          container_id=$(docker run --detach --publish 18000:8000 needleproof:ci)
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/api/live | jq -e '.status == "alive"'
          curl --silent http://127.0.0.1:18000/api/ready \
            | jq -e '.status == "degraded" and .model_ready == false and .corpus_version != null'
          curl --fail --silent --cookie-jar /tmp/needleproof.cookies \
            --header 'content-type: application/json' \
            --data '{"question":"Replay the featured investigation","rehearsal":true}' \
            http://127.0.0.1:18000/api/runs > /tmp/needleproof-run.json
          run_id=$(jq --raw-output '.run_id' /tmp/needleproof-run.json)
          for attempt in $(seq 1 30); do
            status=$(curl --fail --silent --cookie /tmp/needleproof.cookies \
              "http://127.0.0.1:18000/api/runs/$run_id" | jq --raw-output '.status')
            if [ "$status" = completed ]; then
              break
            fi
            sleep 1
          done
          test "$status" = completed
          curl --fail --silent --cookie /tmp/needleproof.cookies \
            "http://127.0.0.1:18000/api/runs/$run_id/receipt.json" \
            | jq -e '
                .status == "completed"
                and .schema_version == "1.3"
                and .provenance.git_commit_sha == "${{ github.sha }}"
                and .provenance.image_revision == "${{ github.sha }}"
                and (.provenance.dependency_lock_digests["uv.lock"] | length == 64)
                and (.provenance.dependency_lock_digests["pnpm-lock.yaml"] | length == 64)
                and (.provenance.binding_contract_sha256 | length == 64)
                and (.provenance.numeric_contract_sha256 | length == 64)
                and (.provenance.absence_protocol_sha256 | length == 64)
              '

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check apps/api/src/needleproof_api tests
      - run: uv run ruff check apps/api/src/needleproof_api tests
      - run: uv run ty check apps/api/src/needleproof_api
      - run: uv run pytest -q
      - run: uv run needleproof rehearsal

  web:
    name: Web and browser contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @needleproof/web check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: needleproof:ci
